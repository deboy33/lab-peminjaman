services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-peminjaman-app
    container_name: lab_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - lab_net
    depends_on:
      - db
    command: >
      sh -c "chown -R www-data:www-data storage bootstrap/cache &&
             chmod -R 775 storage bootstrap/cache &&
             php-fpm"

  nginx:
    image: nginx:alpine
    container_name: lab_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lab_net
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: lab_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: lab_db
      MARIADB_USER: lab
      MARIADB_PASSWORD: labpass
      MARIADB_ROOT_PASSWORD: rootpass
      TZ: Asia/Jakarta
    volumes:
      - lab_db_data:/var/lib/mysql
    networks:
      - lab_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: lab_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    networks:
      - lab_net
    depends_on:
      - db

volumes:
  lab_db_data:
    name: lab-peminjaman_lab_db_data
    external: true

networks:
  lab_net:
    name: lab-peminjaman_lab_net
    external: true
